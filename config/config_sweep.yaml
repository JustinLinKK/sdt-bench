# Sweep config: MLEvolve trace recording on cassava using Claude opus 4.7 SDK.
defaults:
  - config

use_grading_server: false

agent:
  steps: 8
  initial_drafts: 2
  search:
    parallel_search_num: 1   # serial recording for deterministic trace
  code:
    model: claude-opus-4-7
    provider: claude_sdk
    base_url: ""
    api_key: ""
    temp: 1
  feedback:
    model: claude-opus-4-7
    provider: claude_sdk
    base_url: ""
    api_key: ""
    temp: 1
  check_data_leakage: false
